# === PETS configuration for parking-v0 ===
env: parking
env_params: {}
term_fn: "no_termination"
reward_fn: "zero_reward"

goal_proj_fn: null
seed: 0
trial_length: 150
learned_rewards: false
save_video: false
initial_exploration: 1000

# Model + training
hidden_size: 200
grow_buffer: true
num_steps: 1000
model_lr: 0.001
model_wd: 0.0001
checkpoint_model_every: 5000
overrides:
  train_model_online: true
  train_model_offline: true
# Cost + planning
cost_discount: 1.0
cost_aggregation: sum_values
planning_horizon: 15
freq_train_model: 250
train_model_online: true         # 👈 add this
train_model_offline: true

# Cross-Entropy Method planner params
cem_num_iters: 5
cem_elite_ratio: 0.1
cem_population_size: 500
cem_population_decay_factor: 1.0
cem_colored_noise_exponent: 0.5
cem_keep_elite_frac: 0.0
cem_alpha: 0.1

# Misc
acting_module: null
model_load_dir: null

# Optional stability parameters
model_batch_size: 256
model_train_freq: 250
max_rollout_length: 150
normalize_observations: true
normalize_actions: true
use_termination_fn: true
validation_ratio: 0.05

