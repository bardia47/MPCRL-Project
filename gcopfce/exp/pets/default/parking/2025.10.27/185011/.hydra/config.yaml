seed: ${overrides.seed}
device: cpu
log_frequency_agent: 1000
save_video: false
debug_mode: false
experiment: default
root_dir: ./exp
algorithm:
  name: pets
  agent:
    _target_: mbrl.planning.TrajectoryOptimizerAgent
    _recursive_: false
    action_lb: ???
    action_ub: ???
    planning_horizon: ${overrides.planning_horizon}
    optimizer_cfg: ${action_optimizer}
    replan_freq: 1
    verbose: ${debug_mode}
  normalize: true
  normalize_double_precision: true
  target_is_delta: true
  initial_exploration_steps: ${overrides.initial_exploration}
  freq_train_model: ${overrides.freq_train_model}
  learned_rewards: ${overrides.learned_rewards}
  num_particles: 20
dynamics_model:
  _target_: mbrl.models.GaussianMLP
  _recursive_: false
  device: ${device}
  num_layers: 4
  in_size: ???
  out_size: ???
  ensemble_size: 7
  hid_size: ${overrides.hidden_size}
  deterministic: false
  propagation_method: random_model
  learn_logvar_bounds: false
  activation_fn_cfg:
    _target_: torch.nn.SiLU
overrides:
  env: parking
  env_params: {}
  term_fn: none
  reward_fn: none
  seed: 0
  trial_length: 150
  learned_rewards: false
  save_video: false
action_optimizer:
  _target_: mbrl.planning.ICEMOptimizer
  num_iterations: ${overrides.cem_num_iters}
  elite_ratio: ${overrides.cem_elite_ratio}
  population_size: ${overrides.cem_population_size}
  population_decay_factor: ${overrides.cem_population_decay_factor}
  colored_noise_exponent: ${overrides.cem_colored_noise_exponent}
  keep_elite_frac: ${overrides.cem_keep_elite_frac}
  alpha: ${overrides.cem_alpha}
  lower_bound: ???
  upper_bound: ???
  return_mean_elites: true
  population_size_module: ${dynamics_model.ensemble_size}
  device: ${device}
